<!-- Grizzly Tree Experts responsive header. Drop-in fragment; no html/body wrapper required. -->
<style>
  .gte-header{
    --gte-forest:#1B4332;--gte-deep:#081C15;--gte-gold:#D4A72C;--gte-cream:#F5F1E6;
    position:fixed;top:0;left:0;right:0;z-index:9999;
    background:var(--gte-deep);border-bottom:3px solid var(--gte-gold);
    box-shadow:0 6px 24px rgba(0,0,0,.32);font-family:'Inter',system-ui,sans-serif;
    padding-top:env(safe-area-inset-top,0px);isolation:isolate;
  }
  .gte-header,.gte-header *,.gte-header *::before,.gte-header *::after{box-sizing:border-box;}
  .gte-header *{margin:0;padding:0;}
  .gte-inner{position:relative;width:100%;max-width:1240px;min-height:72px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:18px;}

  .gte-logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex:0 1 auto;min-width:0;color:var(--gte-cream);}
  .gte-logo img{display:block;width:48px;height:48px;object-fit:contain;flex:0 0 auto;}
  .gte-logo-text{display:flex;flex-direction:column;line-height:1.08;min-width:0;}
  .gte-logo-text strong{font-family:'Playfair Display',Georgia,serif;font-size:1.1rem;font-weight:900;letter-spacing:.01em;color:var(--gte-cream);white-space:nowrap;}
  .gte-logo-text span{margin-top:4px;font-size:.62rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gte-gold);}

  .gte-nav{display:flex;align-items:center;justify-content:center;gap:4px;}
  .gte-nav a{color:var(--gte-cream);text-decoration:none;font-size:.9rem;font-weight:600;padding:10px 12px;border-radius:3px;white-space:nowrap;}
  .gte-nav a:hover,.gte-nav a:focus-visible{color:var(--gte-gold);background:var(--gte-forest);outline-offset:2px;}

  .gte-cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:0 0 auto;background:var(--gte-gold);color:var(--gte-deep);text-decoration:none;font-weight:800;font-size:.88rem;padding:11px 16px;border-radius:4px;white-space:nowrap;box-shadow:0 4px 16px rgba(212,167,44,.2);}
  .gte-cta:hover,.gte-cta:focus-visible{background:#e8b82e;color:var(--gte-deep);}
  .gte-cta-icon{font-size:1.1rem;line-height:1;}
  .gte-cta-txt{display:flex;flex-direction:column;line-height:1.15;}
  .gte-cta small{display:block;margin-bottom:3px;font-size:.58rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}

  /* Visually hidden but still available to keyboard and assistive technology. */
  .gte-toggle{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .gte-burger{display:none;flex:0 0 46px;width:46px;height:46px;min-width:46px;min-height:46px;align-items:center;justify-content:center;flex-direction:column;gap:5px;border:1px solid rgba(245,241,230,.4);border-radius:5px;background:transparent;cursor:pointer;touch-action:manipulation;}
  .gte-burger span{display:block;width:23px;height:2.5px;flex:0 0 auto;background:var(--gte-cream);border-radius:3px;transition:transform .2s ease,opacity .2s ease;}
  .gte-toggle:focus-visible + .gte-logo{outline:2px solid var(--gte-gold);outline-offset:4px;}

  @media(max-width:1000px){
    .gte-inner{min-height:70px;gap:12px;padding:0 16px;}
    .gte-burger{display:flex;order:4;}
    .gte-logo{order:1;flex:1 1 auto;}
    .gte-cta{order:3;margin-left:auto;}
    .gte-nav{position:absolute;top:100%;left:0;right:0;z-index:10000;display:flex;flex-direction:column;align-items:stretch;gap:0;background:var(--gte-deep);border-bottom:3px solid var(--gte-gold);box-shadow:0 14px 28px rgba(0,0,0,.35);visibility:hidden;opacity:0;max-height:0;overflow:hidden;transition:max-height .25s ease,opacity .2s ease,visibility .2s;}
    .gte-nav a{display:block;width:100%;padding:15px 22px;border-top:1px solid rgba(245,241,230,.13);font-size:1rem;white-space:normal;}
    .gte-toggle:checked ~ .gte-nav{visibility:visible;opacity:1;max-height:360px;}
    .gte-toggle:checked ~ .gte-burger span:nth-child(1){transform:translateY(7.5px) rotate(45deg);}
    .gte-toggle:checked ~ .gte-burger span:nth-child(2){opacity:0;}
    .gte-toggle:checked ~ .gte-burger span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg);}
    .gte-header:has(.gte-toggle:checked) .gte-nav{visibility:visible;}
  }
  @media(max-width:600px){
    .gte-inner{min-height:68px;gap:9px;padding:0 12px;}
    .gte-logo{gap:8px;}
    .gte-logo img{width:42px;height:42px;}
    .gte-logo-text strong{font-size:clamp(.78rem,3.5vw,.95rem);letter-spacing:0;}
    .gte-logo-text span{display:none;}
    .gte-cta{gap:6px;font-size:.78rem;padding:10px 10px;}
    .gte-cta small{display:none;}
    .gte-burger{width:44px;height:44px;min-width:44px;flex-basis:44px;}
  }
  @media(max-width:380px){
    .gte-inner{gap:7px;padding:0 9px;}
    .gte-logo img{width:38px;height:38px;}
    .gte-logo-text strong{font-size:.78rem;max-width:126px;white-space:normal;line-height:1.05;}
    .gte-cta{font-size:0;padding:10px 12px;min-width:42px;min-height:42px;}
    .gte-cta-icon{font-size:1.15rem;}
    .gte-cta-txt{font-size:0;}
    .gte-burger{width:42px;height:42px;min-width:42px;flex-basis:42px;}
  }
  @media(prefers-reduced-motion:reduce){.gte-header *,.gte-header *::before,.gte-header *::after{transition:none!important;}}
</style>

<header class="gte-header" role="banner">
  <div class="gte-inner">
    <input type="checkbox" id="gte-toggle" class="gte-toggle" aria-label="Toggle main navigation" />

    <a class="gte-logo" href="/" aria-label="The Grizzly Tree Experts – Home">
      <img src="https://thegrizzlytreeexperts.com/images/the-grizzly-tree-experts-ga-logo.webp" alt="The Grizzly Tree Experts logo" width="48" height="48" />
      <span class="gte-logo-text">
        <strong>The Grizzly Tree Experts</strong>
        <span>Woodstock, GA</span>
      </span>
    </a>

    <nav class="gte-nav" aria-label="Main navigation">
      <a href="/services/">Services</a>
      <a href="/locations/">Locations</a>
      <a href="/about/">About</a>
      <a href="/contact/">Contact</a>
    </nav>

    <a class="gte-cta" href="tel:+18444430150" aria-label="Call Grizzly Tree Experts at 844-443-0150">
      <span class="gte-cta-icon" aria-hidden="true">&#9742;</span>
      <span class="gte-cta-txt"><small>24/7 Emergency</small>(844) 443-0150</span>
    </a>

    <label for="gte-toggle" class="gte-burger" aria-label="Toggle navigation menu">
      <span></span><span></span><span></span>
    </label>
  </div>
</header>
